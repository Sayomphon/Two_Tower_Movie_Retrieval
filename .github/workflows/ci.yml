name: CI

on:
  push:
    branches: [main]
  pull_request:

# this workflow only reads the code to test it — it writes nothing back to the repo
# (least privilege)
permissions:
  contents: read

# back-to-back pushes on the same ref → cancel the older run, don't leave runners hanging
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the lower/upper bounds of requires-python we actually test (declared: >=3.11,<3.14)
        python-version: ["3.11", "3.12"]

    steps:
      # every action is pinned to a commit SHA — tags can be moved, SHAs cannot (supply-chain)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave a token in .git/config for later steps

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check src tests

      # tests/test_pipeline_integration.py skips itself when ml-100k.zip is not on the machine —
      # so CI never downloads the dataset (slow + MovieLens terms forbid redistribution)
      # the threshold comes from what CI actually measures (68%) minus a buffer — it is a
      # regression gate, not an arbitrary target · pipeline.py sits lower because the paths
      # that need the dataset are skipped
      - run: pytest -q --cov --cov-report=term-missing --cov-fail-under=65
