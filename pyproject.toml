[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-retrieval"
version = "0.1.0"
description = "Two-tower movie recommendation retrieval system on MovieLens 100K — temporal split, popularity baseline, Recall@K/NDCG, coverage/bias analysis, serving index"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Sayomphon Khampromma" }]
dependencies = [
    "tensorflow>=2.16,<2.21",
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "matplotlib>=3.8",
]

[project.scripts]
movie-retrieval = "movie_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S"]
ignore = ["S101"]  # assert ใช้ใน tests/pipeline guards โดยตั้งใจ

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
